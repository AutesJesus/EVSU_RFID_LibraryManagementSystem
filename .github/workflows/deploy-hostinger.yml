name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets_check
        run: |
          missing=0
          for name in DB_HOST DB_USER DB_PASS DB_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ -n "${SSH_PRIVATE_KEY}" ] && [ -n "${SSH_HOST}" ] && [ -n "${SSH_USER}" ] && [ -n "${SSH_REMOTE_PATH}" ]; then
            echo "method=ssh" >> "$GITHUB_OUTPUT"
            echo "Deploy method: SSH/rsync"
          elif [ -n "${FTP_SERVER}" ] && [ -n "${FTP_USERNAME}" ] && [ -n "${FTP_PASSWORD}" ]; then
            echo "method=ftp" >> "$GITHUB_OUTPUT"
            echo "Deploy method: FTPS"
          else
            echo "::error::Add SSH secrets (SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, SSH_REMOTE_PATH) or FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)"
            missing=1
          fi
          exit $missing
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Write production database config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_AUTO_CREATE: "false"
        run: php scripts/ci-write-config.php

      - name: Deploy via SSH (rsync)
        if: steps.secrets_check.outputs.method == 'ssh'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
          SSH_IDENTITY_FILE: ~/.ssh/deploy_key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          bash scripts/deploy-rsync.sh

      - name: Deploy via FTPS
        if: steps.secrets_check.outputs.method == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/coral-seahorse-316772.hostingersite.com/public_html/' }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            **/config/mail.local.php
            **/uploads/**
            !uploads/.gitkeep
            **/.ftp-deploy-sync-state.json
            **/DEPLOYMENT.md
            **/scripts/ci-write-config.php
            **/config/db.local.php.example
            **/config/mail.local.php.example
            **/.ssh/**
