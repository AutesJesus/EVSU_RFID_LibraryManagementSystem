name: Deploy to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (FTPS)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Write production database config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_AUTO_CREATE: "false"
        run: php scripts/ci-write-config.php

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.github/**
            **/config/mail.local.php
            **/uploads/**
            !uploads/.gitkeep
            **/.ftp-deploy-sync-state.json
            **/DEPLOYMENT.md
            **/scripts/ci-write-config.php
            **/config/db.local.php.example
            **/config/mail.local.php.example
