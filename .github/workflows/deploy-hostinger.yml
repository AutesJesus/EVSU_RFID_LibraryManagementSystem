name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets_check
        run: |
          missing=0
          for name in DB_HOST DB_USER DB_PASS DB_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name (set DB_USER or DB_USERNAME, DB_PASS or DB_PASSWORD, DB_NAME or DB_DATABASE)"
              missing=1
            fi
          done
          has_ssh=0
          has_ftp=0
          if [ -n "${SSH_PRIVATE_KEY}" ] && [ -n "${SSH_HOST}" ] && [ -n "${SSH_USER}" ] && [ -n "${SSH_REMOTE_PATH}" ]; then
            has_ssh=1
          fi
          if [ -n "${FTP_SERVER}" ] && [ -n "${FTP_USERNAME}" ] && [ -n "${FTP_PASSWORD}" ]; then
            has_ftp=1
          fi
          method="${DEPLOY_METHOD:-}"
          if [ "$method" = "ftp" ]; then
            if [ "$has_ftp" -ne 1 ]; then
              echo "::error::DEPLOY_METHOD=ftp but FTP secrets are missing"
              missing=1
            fi
            echo "method=ftp" >> "$GITHUB_OUTPUT"
            echo "Deploy method: FTP (lftp) — forced by DEPLOY_METHOD variable"
          elif [ "$method" = "ssh" ]; then
            if [ "$has_ssh" -ne 1 ]; then
              echo "::error::DEPLOY_METHOD=ssh but SSH secrets are missing"
              missing=1
            fi
            echo "method=ssh" >> "$GITHUB_OUTPUT"
            echo "Deploy method: SSH/rsync — forced by DEPLOY_METHOD variable"
          elif [ "$has_ssh" -eq 1 ]; then
            echo "method=ssh" >> "$GITHUB_OUTPUT"
            echo "Deploy method: SSH/rsync (FTP step skipped — this is normal when SSH secrets exist)"
            if [ "$has_ftp" -eq 1 ]; then
              echo "::notice::Both SSH and FTP secrets are set. Using SSH. To use FTP instead, add repository variable DEPLOY_METHOD=ftp"
            fi
          elif [ "$has_ftp" -eq 1 ]; then
            echo "method=ftp" >> "$GITHUB_OUTPUT"
            echo "Deploy method: FTP (lftp)"
          else
            echo "::error::Add SSH secrets (SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, SSH_REMOTE_PATH) or FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)"
            missing=1
          fi
          exit $missing
        env:
          DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASS || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || secrets.DB_DATABASE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Reject XAMPP-style database secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || secrets.DB_USERNAME }}
          DB_NAME: ${{ secrets.DB_NAME || secrets.DB_DATABASE }}
        run: |
          set -e
          err=0
          host_lc=$(printf '%s' "$DB_HOST" | tr '[:upper:]' '[:lower:]')
          if [ "$host_lc" = "127.0.0.1" ] || [ "$host_lc" = "::1" ]; then
            echo "::error::DB_HOST is XAMPP/local ($DB_HOST). Edit the DB_HOST secret → use localhost or the MySQL host from Hostinger hPanel → Databases."
            err=1
          fi
          if [ "$DB_USER" = "root" ]; then
            echo "::error::DB_USER is root (XAMPP). Edit DB_USER → use your Hostinger MySQL user (e.g. u710415762_library from hPanel, not root)."
            err=1
          fi
          if [ "$DB_NAME" = "evsu_rfid_library" ]; then
            echo "::error::DB_NAME is evsu_rfid_library (local XAMPP). Edit DB_NAME → use the database name created in Hostinger hPanel (starts with u)."
            err=1
          fi
          case "$DB_USER" in
            u*) ;;
            *)
              echo "::warning::DB_USER does not start with u — double-check it matches Hostinger hPanel → Databases."
              ;;
          esac
          exit $err

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Write production database config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER || secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASS || secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || secrets.DB_DATABASE }}
          DB_AUTO_CREATE: "false"
        run: php scripts/ci-write-config.php

      - name: Verify production database config
        run: php scripts/verify-deploy-config.php

      - name: Write deploy build marker
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: php scripts/ci-write-deploy-build.php

      - name: Write production email config
        env:
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASS: ${{ secrets.MAIL_SMTP_PASS }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
        run: php scripts/ci-write-mail-config.php

      - name: Deploy via SSH (rsync)
        if: steps.secrets_check.outputs.method == 'ssh'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
          SSH_IDENTITY_FILE: ~/.ssh/deploy_key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          bash scripts/deploy-rsync.sh
          echo "Force-uploading config (db.local.php must not stay as old XAMPP copy)..."
          scp -i "${SSH_IDENTITY_FILE}" -P "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            config/db.local.php config/deploy.build.php \
            "${SSH_USER}@${SSH_HOST}:${SSH_REMOTE_PATH}/config/"
          if [ -f config/mail.local.php ]; then
            scp -i "${SSH_IDENTITY_FILE}" -P "${SSH_PORT}" -o StrictHostKeyChecking=yes \
              config/mail.local.php \
              "${SSH_USER}@${SSH_HOST}:${SSH_REMOTE_PATH}/config/"
          fi
          echo "Busting static file cache (touch CSS/JS)..."
          ssh -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "find ${SSH_REMOTE_PATH} -type f \\( -name '*.css' -o -name '*.js' \\) -exec touch {} + 2>/dev/null || true"
          echo "Verifying remote files..."
          ssh -i "${SSH_IDENTITY_FILE}" -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "test -f ${SSH_REMOTE_PATH}/config/db.local.php && test -f ${SSH_REMOTE_PATH}/index.php && test -f ${SSH_REMOTE_PATH}/site-test.php && ! grep -q \"127.0.0.1\" ${SSH_REMOTE_PATH}/config/db.local.php && wc -c < ${SSH_REMOTE_PATH}/admin/assets/admin.css | grep -qE '^[0-9]{5,}' && echo 'Remote OK: db.local.php, index.php, site-test.php, admin.css synced'"

      - name: Deploy via FTP (lftp — Hostinger)
        if: steps.secrets_check.outputs.method == 'ftp'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || 'domains/coral-seahorse-316772.hostingersite.com/public_html' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          try_dirs() {
            local dir="$1"
            echo "Uploading to remote directory: ${dir}"
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -e "\
              set net:timeout 30; \
              set net:max-retries 2; \
              set ssl:verify-certificate no; \
              set ftp:ssl-allow true; \
              open -p ${FTP_PORT} ftps://${FTP_SERVER}; \
              cd \"${dir}\" || exit 1; \
              mirror -R --verbose --exclude .git/ --exclude .github/ --exclude .ssh/ \
                --exclude uploads/ \
                --exclude DEPLOYMENT.md --exclude-glob config/*.example \
                ./ ./; \
              bye"
          }
          if try_dirs "${FTP_REMOTE_DIR}"; then
            echo "Force-uploading config via FTP..."
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -e "\
              set ssl:verify-certificate no; \
              set ftp:ssl-allow true; \
              open -p ${FTP_PORT} ftps://${FTP_SERVER}; \
              cd \"${FTP_REMOTE_DIR}/config\"; \
              put config/db.local.php; \
              put config/mail.local.php; \
              put config/deploy.build.php; \
              bye"
            echo "Verifying remote db.local.php is not XAMPP..."
            lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -e "\
              set ssl:verify-certificate no; \
              set ftp:ssl-allow true; \
              open -p ${FTP_PORT} ftps://${FTP_SERVER}; \
              cat \"${FTP_REMOTE_DIR}/config/db.local.php\" | head -20; \
              bye" | grep -q "127.0.0.1" && { echo "::error::Remote db.local.php still contains 127.0.0.1"; exit 1; } || true
            echo "Deploy succeeded. Check: https://coral-seahorse-316772.hostingersite.com/site-test.php"
            exit 0
          fi
          echo "First path failed, trying public_html ..."
          if try_dirs "public_html"; then exit 0; fi
          echo "Trying ./public_html ..."
          if try_dirs "./public_html"; then exit 0; fi
          echo "::error::FTP upload failed. Check FTP_PASSWORD in GitHub secrets and reset FTP password in Hostinger hPanel."
          exit 1
